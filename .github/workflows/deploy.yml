name: Frontend Deploy

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          CI: "false"

      - name: Upload build to EC2 (temp folder)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/*"
          target: /home/ubuntu/frontend-build
          strip_components: 1
          overwrite: true

      - name: Sync to web root
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            test -f /home/ubuntu/frontend-build/index.html
            rsync -a --delete /home/ubuntu/frontend-build/ /var/www/vhosts/frontend/
